    EMBED_DIM: [48, 72, 96]
    DEPTHS_1: [1, 2]
    DEPTHS_2: [1, 2]
    DEPTHS_3: [4, 5, 6]
    DEPTHS_4: [1, 2]
    NUM_HEADS_1: [1, 2, 3]
