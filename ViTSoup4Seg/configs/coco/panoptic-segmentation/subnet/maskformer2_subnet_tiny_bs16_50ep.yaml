    NUM_HEADS_4: [8, 12, 24]
    MASK_RATIO: [7, 5, 3]
    WINDOW_SIZE: [7]
    MLP_RATIO: [3.5, 4.0]
    MERGE_SIZE: [2]
  SEM_SEG_HEAD:
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
    ENC_IN_FEATURES: [["res3", "res4", "res5"], ["res4", "res5"], ["res5"]]
    CONVS_DIM: [128, 192, 256]
    MASK_DIM: [128, 192, 256]
    ENC_DEPTHS: [4, 5, 6]
    ENC_N_POINTS: [3, 4]
    ENC_N_HEADS: [4, 8]
