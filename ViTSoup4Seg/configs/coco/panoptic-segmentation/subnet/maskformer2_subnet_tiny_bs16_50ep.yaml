_BASE_: ../Base-COCO-PanopticSegmentation.yaml
MODE: "subnet"
MODEL:
  META_ARCHITECTURE: "SuperMaskFormer"
  PRETRAIN_IMG_SIZE: 224
  BACKBONE:
    NAME: "D2TransformerSuper"
    PATCH_SIZE: 4
    EMBED_DIM: 96
    DEPTHS: [2, 2, 6, 2]
    NUM_HEADS: [3, 6, 12, 24]
    SHIFT: False
    MLP_RATIO: 4.0
    QKV_BIAS: True
    QK_SCALE: null
    DROP_RATE: 0.0
    ATTN_DROP_RATE: 0.0
    DROP_PATH_RATE: 0.3
    ACT_LAYER: "gelu"
    ABS_POS: False
    REL_POS: True
    MAX_REL_POS: 7
    PATCH_NORM: True
    PRE_NORM: False
    NORM: "LN"
    CHANGE_QKV: True
    MERGE_SIZE: 2
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
    SCALE: False
    USE_CHECKPOINT: False
  SEM_SEG_HEAD:
    NAME: "SuperMaskFormerHead"
    IGNORE_VALUE: 255
    NUM_CLASSES: 133
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
    LOSS_WEIGHT: 1.0
    # pixel decoder
    PIXEL_DECODER_NAME: "SuperMSDeformAttnPixelDecoder"
    ENC_IN_FEATURES: ["res3", "res4", "res5"]
    CONVS_DIM: 256
    MASK_DIM: 256
    ENC_DEPTHS: 6
    PRE_NORM: False
    NORM: "GN"
    TRANSFORMER_NORM: "LN"
    ACT_LAYER: "relu"
    ENC_N_POINTS: 4
    ENC_N_HEADS: 8
    ENC_MLP_RATIO: 4.0
    DROPOUT: 0.0
    COMMON_STRIDE: 4
    SCALE: False
    USE_CHECKPOINT: False
  MASK_FORMER:
    TRANSFORMER_DECODER_NAME: "SuperMultiScaleMaskedTransformerDecoder"
    TRANSFORMER_IN_FEATURE: "multi_scale_pixel_decoder"
    DEC_IN_FEATURES: ["res3", "res4", "res5"]
    HIDDEN_DIM: 256
    NUM_OBJECT_QUERIES: 100
    DEC_DEPTHS: 10  # including for the loss on learnable query
    DEC_N_HEADS: 8
    DEC_MLP_RATIO: 8.0
    DROPOUT: 0.0
    ACT_LAYER: "relu"
    PRE_NORM: False
    NORM: "LN"
    ENFORCE_INPUT_PROJ: True
    DEEP_SUPERVISION: True
    NO_OBJECT_WEIGHT: 0.1
    CLASS_WEIGHT: 2.0
    MASK_WEIGHT: 5.0
    DICE_WEIGHT: 5.0
    SIZE_DIVISIBILITY: 32
    TRAIN_NUM_POINTS: 12544
    OVERSAMPLE_RATIO: 3.0
    IMPORTANCE_SAMPLE_RATIO: 0.75
    QKV_BIAS: False
    QK_SCALE: null
    CHANGE_QKV: True
    SCALE: False
    USE_CHECKPOINT: False
    TEST:
      SEMANTIC_ON: True
      INSTANCE_ON: True
      PANOPTIC_ON: True
      OVERLAP_THRESHOLD: 0.8
      OBJECT_MASK_THRESHOLD: 0.8
      SEM_SEG_POSTPROCESSING_BEFORE_INFERENCE: False
SEARCH_SPACE:
